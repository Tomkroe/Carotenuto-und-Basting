services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: makler
      POSTGRES_PASSWORD: makler
      POSTGRES_DB: maklerprogram
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MinIO ist der S3-kompatible Objektspeicher für hochgeladene Dokumente
  # (Mietverträge etc.). Lokal/self-hosted per Default; in Produktion zeigt
  # S3_ENDPOINT (siehe unten) stattdessen auf die eigene Storage-Hardware
  # im Büro (z.B. per VPN erreichbares NAS/MinIO) — kein Cloud-Anbieter.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Für lokale Entwicklung reicht in der Regel `pnpm dev` gegen die obigen
  # postgres/minio-Services. `api` und `web` unten sind für die Produktions-
  # Bereitstellung (z.B. auf dem Hetzner-VPS) gedacht: `docker compose up -d`
  # baut und startet die kompletten Container-Images.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: "postgresql://makler:makler@postgres:5432/maklerprogram?schema=public"
      S3_ENDPOINT: "http://minio:9000"
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - apps/web/.env
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
